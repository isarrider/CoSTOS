name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The comments are part of the review (ARCHITECTURE 6.1, comments
      # rule): broken links or malformed doc comments fail the build.
      - run: cargo doc --no-deps --workspace --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  bare-metal:
    # ARCHITECTURE 6.1 rule 12: costos-core, costos-safety and costos-cycle must build
    # without std, so std can't creep back in unnoticed.
    name: no_std build (riscv32imafc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imafc-unknown-none-elf
      - run: cargo build -p costos-core -p costos-safety -p costos-cycle --target riscv32imafc-unknown-none-elf --release
