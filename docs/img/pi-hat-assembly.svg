<text x="292.0" y="168.0" class="w" text-anchor="middle">MAX31865</text>
<rect x="340.0" y="260.0" width="180.0" height="54.0" rx="2" fill="#151515" stroke="#3a3a3a" stroke-width="1" fill-opacity="1"/>
<text x="430.0" y="291.0" class="w" text-anchor="middle">watchdog · driver · DC/DC</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker></defs>
<line x1="145.0" y1="260.0" x2="106.0" y2="260.0" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
<text x="102.0" y="264.0" class="t" text-anchor="end">sensors + pump</text>
<line x1="688.0" y1="140.0" x2="730.0" y2="140.0" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
<text x="734.0" y="144.0" class="t" text-anchor="start">network</text>
<text x="160" y="524.0" class="n" text-anchor="start">• The HAT covers the left 65 mm; Ethernet and USB stay free on the right.</text>
<text x="160" y="540.0" class="n" text-anchor="start">• Sensor and pump terminals face left (D17); the front edge keeps PWR/REL1, above the</text>
<text x="160" y="556.0" class="n" text-anchor="start">  Pi's USB-C and µHDMI sockets; the USB-C plug fits below the HAT (check in KiCad).</text>
<rect x="870.0" y="370.0" width="510.0" height="9.600000000000001" rx="0" fill="#2f7d3a" stroke="#1b4d23" stroke-width="1" fill-opacity="1"/>
<text x="874.0" y="396.0" class="n" text-anchor="start">Pi 5 PCB</text>
<rect x="1260.0" y="289.0" width="129.0" height="81.0" rx="2" fill="#b8bcc0" stroke="#6b7075" stroke-width="1" fill-opacity="1"/>
<text x="1324.5" y="333.5" class="n" text-anchor="middle">RJ45</text>
<rect x="960.0" y="310.0" width="240.0" height="60.0" rx="2" fill="#9aa3ab" stroke="#5f6468" stroke-width="1" fill-opacity="1"/>
<text x="1080.0" y="344.0" class="w" text-anchor="middle">Pi 5 active cooler (≈ 10 mm)</text>
<rect x="912.0" y="319.0" width="306.0" height="51.0" rx="0" fill="none" stroke="#C9A227" stroke-width="1.5" fill-opacity="1" stroke-dasharray="4 3"/>
<text x="916.0" y="283.0" class="n" text-anchor="start">behind: GPIO pins + stacking header (dashed)</text>
<rect x="883.8" y="268.0" width="14.399999999999999" height="102.0" rx="0" fill="#d4af37" stroke="#8a6d1f" stroke-width="1" fill-opacity="1"/>
<rect x="1231.8" y="268.0" width="14.399999999999999" height="102.0" rx="0" fill="#d4af37" stroke="#8a6d1f" stroke-width="1" fill-opacity="1"/>
<rect x="870.0" y="258.4" width="390.0" height="9.600000000000001" rx="0" fill="#1E5631" stroke="#0F3A20" stroke-width="1" fill-opacity="1"/>
<text x="1268.0" y="267.4" class="tb" text-anchor="start">OSCoST HAT</text>
<rect x="954.0" y="207.39999999999998" width="42.0" height="51.0" rx="2" fill="#E9E2CC" stroke="#8A7F5F" stroke-width="1" fill-opacity="1"/>
<rect x="1014.0" y="207.39999999999998" width="42.0" height="51.0" rx="2" fill="#E9E2CC" stroke="#8A7F5F" stroke-width="1" fill-opacity="1"/>
<text x="1014.0" y="196.0" class="n" text-anchor="middle">PWR    REL1</text>
<line x1="834.0" y1="370.0" x2="834.0" y2="268.0" stroke="#333" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="828.0" y="323.0" class="t" text-anchor="end">≈ 17 mm</text>
<text x="828.0" y="339.0" class="n" text-anchor="end">spacers</text>
<text x="870" y="430.0" class="n" text-anchor="start">• Pi 5 with its active cooler under the HAT: spacers ≈ 16–17 mm and a stacking</text>
<text x="870" y="446.0" class="n" text-anchor="start">  header; the exact height is fixed in KiCad against the cooler's datasheet.</text>
<text x="870" y="462.0" class="n" text-anchor="start">• Pi 4 without cooler: standard 11–12 mm spacers.</text>
<text x="870" y="478.0" class="n" text-anchor="start">• The stacking header also lets the VBus adapter plug on top during shadow mode.</text>
</svg>