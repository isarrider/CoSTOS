<rect x="202.6" y="86.0" width="304.79999999999995" height="30.0" rx="0" fill="#111" stroke="none" stroke-width="1" fill-opacity="1"/>
<text x="355.0" y="140.0" class="g" text-anchor="middle">40-pin header</text>
