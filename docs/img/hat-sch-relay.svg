<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Helvetica, Arial, sans-serif">
<title>CoSTOS HAT rev A: relay supply and relay outputs</title>
<desc>High-side load switch enabled by WD_OK creating the switched 5 V relay supply; two low-side MOSFET relay outputs with flyback diode, LED and gate pull-down.</desc>
<style>.w{stroke:#222;stroke-width:2;fill:none}.b{stroke:#222;stroke-width:2;fill:white}.r{font-size:12px;font-weight:bold;fill:#222}.v{font-size:11px;fill:#444}.pn{font-size:11px;fill:#222}.num{font-size:10px;fill:#c62828}.n{font-size:11px;fill:#555;font-style:italic}.h{font-size:16px;font-weight:bold;fill:#222}</style>
<rect width="1180" height="520" fill="white"/>
<text x="20" y="30" class="h" text-anchor="start">7 · Relay supply (switched by the watchdog)</text>
<rect x="150" y="110" width="130" height="130" rx="3" style="fill:#fafafa;stroke:#222;stroke-width:2"/>
<text x="215.0" y="173.0" class="r" text-anchor="middle">U7</text>
<text x="215.0" y="188.0" class="v" text-anchor="middle">TPS22918</text>
<text x="215.0" y="202.0" class="n" text-anchor="middle">load switch 2 A</text>
<text x="155" y="134" class="pn" text-anchor="start">VIN</text>
<text x="146" y="126" class="num" text-anchor="end">1</text>
<path class="w" d="M150 130 L130 130"/>
<text x="155" y="214" class="pn" text-anchor="start">ON</text>
<text x="146" y="206" class="num" text-anchor="end">3</text>
<path class="w" d="M150 210 L130 210"/>
<text x="275" y="134" class="pn" text-anchor="end">VOUT</text>
<text x="284" y="126" class="num" text-anchor="start">6</text>
<path class="w" d="M280 130 L300 130"/>
<text x="275" y="174" class="pn" text-anchor="end">QOD</text>
<text x="284" y="166" class="num" text-anchor="start">5</text>
<path class="w" d="M280 170 L300 170"/>
<text x="275" y="214" class="pn" text-anchor="end">CT</text>
<text x="284" y="206" class="num" text-anchor="start">4</text>
<path class="w" d="M280 210 L300 210"/>
<text x="215" y="234" class="pn" text-anchor="middle">GND</text>
<text x="219" y="254" class="num" text-anchor="start">2</text>
<path class="w" d="M215 240 L215 260"/>
<path class="w" d="M130 130 L60 130"/>
<path d="M60 130 V118 M48 118 H72" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="60" y="108" class="r" text-anchor="middle" style="fill:#ef6c00">+5V</text>
<circle cx="90" cy="130" r="3.5" fill="#222"/>
<g transform="translate(90 130) rotate(90)"><path class="w" d="M0 0 H17"/><path class="w" d="M23 0 H40"/><path class="w" d="M17 -12 V12" style="stroke-width:2.5"/><path class="w" d="M23 -12 V12" style="stroke-width:2.5"/></g>
<text x="106.0" y="148.0" class="r" text-anchor="start">C11</text>
<text x="106.0" y="162.0" class="v" text-anchor="start">1 µF</text>
<path d="M90 170 V180 M78 180 H102 M82 185 H98 M86 190 H94" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path class="w" d="M130 210 L120 210"/>
