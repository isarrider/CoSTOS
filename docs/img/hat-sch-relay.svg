<circle cx="240" cy="110" r="3.5" fill="#222"/>
<g transform="translate(240 110) rotate(90)"><path class="w" d="M0 0 H12"/><path class="w" d="M48 0 H60"/><rect class="b" x="12" y="-7" width="36" height="14"/></g>
<text x="224.0" y="138.0" class="r" text-anchor="end">R45</text>
<text x="224.0" y="152.0" class="v" text-anchor="end">100 kΩ</text>
<g transform="translate(300 190)"><path class="w" d="M-30 0 H-14 M-14 -14 V14"/><path class="w" d="M-8 -17 V-7 M-8 -5 V5 M-8 7 V17" style="stroke-width:2.5"/><path class="w" d="M-8 -12 H0 V-30 M-8 12 H0 V30 M-8 0 H0 V-12"/><path d="M-1 0 L-8 -4 L-8 4 Z" fill="#222"/></g>
<text x="310" y="188" class="r" text-anchor="start">Q12</text>
<text x="310" y="202" class="v" text-anchor="start">AO3401A</text>
<text x="310" y="215" class="n" text-anchor="start">relay supply switch</text>
<path class="w" d="M300 110 L300 160"/>
<path class="w" d="M240 170 L240 220"/>
<path class="w" d="M270 190 L240 190"/>
<circle cx="240" cy="190" r="3.5" fill="#222"/>
<g transform="translate(240 250)"><circle cx="-4" cy="0" r="17" style="fill:white;stroke:#222;stroke-width:1.5"/><path class="w" d="M-30 0 H-10 M-10 -11 V11" style="stroke-width:2.5"/><path class="w" d="M-10 -5 L0 -13 V-30 M-10 5 L0 13 V30"/><path d="M0 13 L-7 12 L-3 7 Z" fill="#222"/></g>
<text x="258" y="248" class="r" text-anchor="start">Q13</text>
<text x="258" y="262" class="v" text-anchor="start">MMBT3904</text>
<text x="258" y="275" class="n" text-anchor="start">on while WD_OK</text>
<path class="w" d="M240 280 L240 290"/>
<path d="M240 290 V300 M228 300 H252 M232 305 H248 M236 310 H244" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
