<path class="w" d="M300 130 L400 130"/>
<path class="w" d="M300 170 L320 170 L320 130"/>
<circle cx="320" cy="130" r="3.5" fill="#222"/>
<path class="w" d="M295 205 L305 215 M295 215 L305 205"/>
<circle cx="350" cy="130" r="3.5" fill="#222"/>
<g transform="translate(350 130) rotate(90)"><path class="w" d="M0 0 H17"/><path class="w" d="M23 0 H40"/><path class="w" d="M17 -12 V12" style="stroke-width:2.5"/><path class="w" d="M23 -12 V12" style="stroke-width:2.5"/></g>
<text x="366.0" y="148.0" class="r" text-anchor="start">C12</text>
<text x="366.0" y="162.0" class="v" text-anchor="start">1 µF</text>
<path d="M350 170 V180 M338 180 H362 M342 185 H358 M346 190 H354" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path d="M400 130 V118 M388 118 H412" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="400" y="108" class="r" text-anchor="middle" style="fill:#ef6c00">+5V_REL</text>
<path class="w" d="M215 260 L215 270"/>
<path d="M215 270 V280 M203 280 H227 M207 285 H223 M211 290 H219" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<text x="20" y="330" class="n" text-anchor="start">WD_OK low → VOUT off (QOD discharges it): every relay</text>
<text x="20" y="345" class="n" text-anchor="start">output is off, whatever the GPIOs do.</text>
<text x="20" y="360" class="n" text-anchor="start">CT open: fastest turn-on.</text>
<text x="20" y="375" class="n" text-anchor="start"></text>
<text x="20" y="390" class="n" text-anchor="start">Load per output: DIN-rail SSR with 3–32 V DC input</text>
<text x="20" y="405" class="n" text-anchor="start">(typ. &lt; 20 mA) or a 5 V relay coil up to about 100 mA.</text>
<text x="20" y="420" class="n" text-anchor="start">D6 catches a coil's turn-off spike; with an SSR it</text>
<text x="20" y="435" class="n" text-anchor="start">does nothing.</text>
<text x="520" y="30" class="h" text-anchor="start">8 · Relay / SSR outputs (low-side)</text>
<path d="M700 70 V58 M688 58 H712" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="700" y="48" class="r" text-anchor="middle" style="fill:#ef6c00">+5V_REL</text>
<path class="w" d="M700 70 L920 70 L920 90 L960 90"/>
<circle cx="780" cy="70" r="3.5" fill="#222"/>
<circle cx="850" cy="70" r="3.5" fill="#222"/>
