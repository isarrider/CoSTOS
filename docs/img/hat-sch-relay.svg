<text x="866.0" y="98.0" class="r" text-anchor="start">R17</text>
<text x="866.0" y="112.0" class="v" text-anchor="start">1 kΩ</text>
<g transform="translate(850 130) rotate(90)"><path class="w" d="M0 0 H12"/><path class="w" d="M28 0 H40"/><path d="M12 -9 L28 0 L12 9 Z" style="fill:white;stroke:#222;stroke-width:2"/><path class="w" d="M28 -9 V9"/><path class="w" d="M14 -12 L21 -20" style="stroke-width:1.5"/><path d="M21 -20 L16 -18 L20 -15 Z" fill="#222"/><path class="w" d="M22 -12 L29 -20" style="stroke-width:1.5"/><path d="M29 -20 L24 -18 L28 -15 Z" fill="#222"/></g>
<text x="880.0" y="148.0" class="r" text-anchor="start">D7</text>
<text x="880.0" y="162.0" class="v" text-anchor="start">yellow</text>
<path class="w" d="M850 170 L850 190"/>
<rect x="960" y="72" width="34" height="76" rx="3" style="fill:#E9E2CC;stroke:#8A7F5F;stroke-width:1.5"/>
