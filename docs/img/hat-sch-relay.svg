<circle cx="190" cy="250" r="3.5" fill="#222"/>
<g transform="translate(190 250) rotate(180)"><path class="w" d="M0 0 H12"/><path class="w" d="M48 0 H60"/><rect class="b" x="12" y="-7" width="36" height="14"/></g>
<text x="160.0" y="236.0" class="v" text-anchor="middle"><tspan class="r">R46</tspan> 10 kΩ</text>
<path class="w" d="M130 250 L110 250"/>
<polygon points="110,250 102,241 59,241 59,259 102,259" style="fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5"/>
