<path class="w" d="M300 220 L300 230 L460 230"/>
<circle cx="400" cy="230" r="3.5" fill="#222"/>
<g transform="translate(400 230) rotate(90)"><path class="w" d="M0 0 H17"/><path class="w" d="M23 0 H40"/><path class="w" d="M17 -12 V12" style="stroke-width:2.5"/><path class="w" d="M23 -12 V12" style="stroke-width:2.5"/></g>
<text x="416.0" y="248.0" class="r" text-anchor="start">C12</text>
<text x="416.0" y="262.0" class="v" text-anchor="start">1 µF</text>
<path d="M400 270 V280 M388 280 H412 M392 285 H408 M396 290 H404" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path d="M460 230 V218 M448 218 H472" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="460" y="208" class="r" text-anchor="middle" style="fill:#ef6c00">+5V_REL</text>
<text x="20" y="380" class="n" text-anchor="start">WD_OK high → Q13 pulls the gate of Q12 to 0 V → +5V_REL on.</text>
<text x="20" y="395" class="n" text-anchor="start">WD_OK low or floating → R45 holds the gate at 5 V → every</text>
<text x="20" y="410" class="n" text-anchor="start">relay output is off, whatever the GPIOs do (D23).</text>
<text x="20" y="425" class="n" text-anchor="start"></text>
<text x="20" y="440" class="n" text-anchor="start">Load per output: DIN-rail SSR with 3–32 V DC input</text>
<text x="20" y="455" class="n" text-anchor="start">(typ. &lt; 20 mA) or a 5 V relay coil up to about 100 mA.</text>
<text x="20" y="470" class="n" text-anchor="start">D6 catches a coil's turn-off spike; with an SSR it</text>
<text x="20" y="485" class="n" text-anchor="start">does nothing.</text>
<text x="520" y="30" class="h" text-anchor="start">8 · Relay / SSR outputs (low-side)</text>
