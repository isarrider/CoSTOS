<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="Helvetica, Arial, sans-serif">
<title>CoSTOS HAT rev A: relay supply and relay outputs</title>
<desc>P-MOSFET high-side switch, turned on by an NPN transistor from WD_OK, creating the switched 5 V relay supply; two low-side MOSFET relay outputs with flyback diode, LED and gate pull-down.</desc>
<style>.w{stroke:#222;stroke-width:2;fill:none}.b{stroke:#222;stroke-width:2;fill:white}.r{font-size:12px;font-weight:bold;fill:#222}.v{font-size:11px;fill:#444}.pn{font-size:11px;fill:#222}.num{font-size:10px;fill:#c62828}.n{font-size:11px;fill:#555;font-style:italic}.h{font-size:16px;font-weight:bold;fill:#222}</style>
<rect width="1180" height="600" fill="white"/>
<text x="20" y="30" class="h" text-anchor="start">7 · Relay supply (switched by the watchdog)</text>
<path d="M80 110 V98 M68 98 H92" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="80" y="88" class="r" text-anchor="middle" style="fill:#ef6c00">+5V</text>
