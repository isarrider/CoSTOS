<text x="764.0" y="148.0" class="r" text-anchor="end">D6</text>
<text x="764.0" y="162.0" class="v" text-anchor="end">1N4148W</text>
<path class="w" d="M780 170 L780 190"/>
<path class="w" d="M780 130 L780 70"/>
