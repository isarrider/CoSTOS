<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" font-family="Helvetica, Arial, sans-serif">
<title>OSCoST HAT rev A: Pt1000 and 1-Wire inputs</title>
<desc>MAX31865 RTD-to-digital converter on SPI0 for the Pt1000 collector sensor in 2-wire connection with 4.3 kilo-ohm reference; two 1-Wire buses on GPIO 4 and 17 with pull-ups, ESD protection and a fused 3.3 V sensor supply.</desc>
