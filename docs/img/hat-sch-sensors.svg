<path class="w" d="M605 285 L615 295 M605 295 L615 285"/>
<text x="20" y="545" class="n" text-anchor="start">2-wire (default): JP2 and JP3 closed (FORCE+ = RTDIN+, RTDIN− = FORCE−), JP4 ties FORCE2 to GND.</text>
<text x="20" y="560" class="n" text-anchor="start">3-wire: open JP2, third wire to TP2, move JP4 to FORCE+. Not needed with the 2-wire roof cable.</text>
<text x="20" y="575" class="n" text-anchor="start">R21 (0.1 %) sets the Pt1000 range; C13 across the RTD as the datasheet gives for 1 kΩ RTDs.</text>
<text x="20" y="590" class="n" text-anchor="start">U9 with J7 (PT2): identical, CS = CE1 = GPIO7 (pin 26); not fitted.</text>
<text x="20" y="605" class="n" text-anchor="start">DRDY is not used: OSCoST polls once per second.</text>
