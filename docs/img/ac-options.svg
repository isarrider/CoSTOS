<text x="237.5" y="364" class="s" text-anchor="middle">own case</text>
<text x="237.5" y="378" class="s" text-anchor="middle">watchdog gates PWM</text>
<text x="237.5" y="392" class="s" text-anchor="middle">PWM1 · FB1</text>
<text x="237.5" y="406" class="s" text-anchor="middle">sensors · Ethernet</text>
<polyline points="205,235 205,330" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<polyline points="235,235 235,330" fill="none" stroke="#000" stroke-width="2.2"/>
<text x="198" y="284" class="n" text-anchor="end">5 V / GND</text>
<text x="198" y="298" class="n" text-anchor="end">→ HAT PWR</text>
<polyline points="325,400 410,400 410,145" fill="none" stroke="#555" stroke-width="1.6"/>
<text x="415" y="300" class="n" text-anchor="start">PWM</text>
<text x="415" y="314" class="n" text-anchor="start">GND</text>
<text x="415" y="328" class="n" text-anchor="start">FB</text>
<text x="18" y="480" class="n" text-anchor="start">• Ways to stop the pump: 1 (PWM low)</text>
<text x="18" y="498" class="n" text-anchor="start">• Electrician wires the box briefly</text>
<text x="18" y="516" class="n" text-anchor="start">• Tidy: one supply for Pi + HAT</text>
<text x="18" y="534" class="n" text-anchor="start">• Stuck-high PWM driver: alarm only</text>
</g>
