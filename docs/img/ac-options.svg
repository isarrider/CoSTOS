<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 640" font-family="Helvetica, Arial, sans-serif">
<style>.t{font-size:12px;font-weight:bold}.s{font-size:10.5px;fill:#333}.o{font-size:10px;font-style:italic;fill:#888}.h{font-size:15px;font-weight:bold}.c{font-size:15px;font-weight:bold;fill:#2b6e2b}.n{font-size:11px;fill:#333}.big{font-size:17px;font-weight:bold}</style>
<rect width="1520" height="640" fill="white"/>
<text x="20" y="34" class="big" text-anchor="start">OSCoST — three slim options for the 230 V side (pump: Wilo iPWM2, solar profile)</text>
<g transform="translate(20,55)">
<rect x="0" y="0" width="480" height="570" rx="10" fill="#fcfcfc" stroke="#bbb"/>
<text x="14" y="26" class="h" text-anchor="start">A — no mains work</text>
<text x="466" y="26" class="c" text-anchor="end">≈ €20–25</text>
<rect x="10" y="50" width="110" height="100" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text x="65.0" y="68" class="t" text-anchor="middle">Wall sockets</text>
<text x="65.0" y="84" class="s" text-anchor="middle">existing circuit</text>
<text x="65.0" y="98" class="s" text-anchor="middle">breaker + RCD</text>
<text x="65.0" y="112" class="s" text-anchor="middle">(2 × Schuko)</text>
<polyline points="120,85 350,85" fill="none" stroke="#8B4513" stroke-width="2.2"/>
<polyline points="120,105 350,105" fill="none" stroke="#1f5fbf" stroke-width="2.2"/>
<polyline points="120,125 350,125" fill="none" stroke="#3a9d23" stroke-width="2.2"/>
<text x="235" y="79" class="n" text-anchor="middle">pump on a plug cord, permanently powered</text>
<rect x="350" y="45" width="120" height="100" rx="6" fill="#fff7e6" stroke="#333" stroke-width="1.5"/>
<text x="410.0" y="63" class="t" text-anchor="middle">Solar pump</text>
<text x="410.0" y="79" class="s" text-anchor="middle">Wilo Yonos PARA</text>
<text x="410.0" y="93" class="s" text-anchor="middle">iPWM2 (solar)</text>
<text x="410.0" y="107" class="s" text-anchor="middle">stops &lt; 7 % duty</text>
<rect x="150" y="175" width="140" height="70" rx="6" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<text x="220.0" y="193" class="t" text-anchor="middle">Pi USB-C supply</text>
<text x="220.0" y="209" class="s" text-anchor="middle">27 W, in a socket</text>
<polyline points="40,150 40,210 150,210" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="45" y="230" class="o" text-anchor="start">plug</text>
<rect x="150" y="330" width="175" height="120" rx="6" fill="#eef5ff" stroke="#333" stroke-width="1.5"/>
<text x="237.5" y="348" class="t" text-anchor="middle">Raspberry Pi + HAT</text>
<text x="237.5" y="364" class="s" text-anchor="middle">own case</text>
<text x="237.5" y="378" class="s" text-anchor="middle">watchdog gates PWM</text>
<text x="237.5" y="392" class="s" text-anchor="middle">PWM1 · FB1</text>
<text x="237.5" y="406" class="s" text-anchor="middle">sensors · Ethernet</text>
<polyline points="220,245 220,330" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="228" y="290" class="n" text-anchor="start">USB-C 5 V</text>
<polyline points="325,400 410,400 410,145" fill="none" stroke="#555" stroke-width="1.6"/>
<text x="415" y="300" class="n" text-anchor="start">PWM</text>
<text x="415" y="314" class="n" text-anchor="start">GND</text>
<text x="415" y="328" class="n" text-anchor="start">FB</text>
<text x="18" y="480" class="n" text-anchor="start">• Ways to stop the pump: 1 (PWM low)</text>
<text x="18" y="498" class="n" text-anchor="start">• No mains wiring at all, if the pump</text>
<text x="18" y="516" class="n" text-anchor="start">   gets a plug cord</text>
<text x="18" y="534" class="n" text-anchor="start">• Stuck-high PWM driver: alarm only</text>
</g>
<g transform="translate(520,55)">
