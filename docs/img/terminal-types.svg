<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif">
  <title>Pluggable versus fixed screw terminal, side view</title>
  <desc>Left: a pluggable terminal, a socket soldered to the board and a separate plug with the screws and the wire, lifted off. Right: a fixed terminal, one block soldered to the board with the wire screwed directly into it. The HAT uses fixed terminals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .h { font-size: 14px; font-weight: bold; fill: #222; }
    .s { font-size: 12px; fill: #555; }
  </style>
  <rect width="680" height="330" fill="white"/>
  <text class="h" x="180" y="40" text-anchor="middle">Pluggable (2 parts)</text>
  <text class="h" x="520" y="40" text-anchor="middle">Fixed (1 part), used on the HAT</text>
  <line x1="340" y1="30" x2="340" y2="310" stroke="#ccc" stroke-width="1"/>

  <!-- pluggable: plug, lifted off -->
  <text class="s" x="180" y="78" text-anchor="middle">Plug: screws + wire</text>
  <rect x="150" y="104" width="60" height="58" rx="3" fill="#43A047" stroke="#1B5E20" stroke-width="1"/>
  <rect x="158" y="96" width="16" height="8" rx="1" fill="#9E9E9E" stroke="#616161" stroke-width="0.8"/>
  <rect x="186" y="96" width="16" height="8" rx="1" fill="#9E9E9E" stroke="#616161" stroke-width="0.8"/>
  <line x1="161" y1="100" x2="171" y2="100" stroke="#424242" stroke-width="1.5"/>
  <line x1="189" y1="100" x2="199" y2="100" stroke="#424242" stroke-width="1.5"/>
  <rect x="150" y="136" width="8" height="12" fill="#1B5E20"/>
  <line x1="60" y1="142" x2="150" y2="142" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <rect x="162" y="162" width="6" height="12" fill="#BDBDBD"/>
  <rect x="192" y="162" width="6" height="12" fill="#BDBDBD"/>
  <line x1="232" y1="196" x2="232" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="s" x="242" y="166">pulls off</text>
  <!-- pluggable: socket -->
  <rect x="148" y="182" width="64" height="48" rx="3" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
  <rect x="156" y="182" width="18" height="10" fill="#1B5E20"/>
  <rect x="186" y="182" width="18" height="10" fill="#1B5E20"/>
  <line x1="165" y1="244" x2="165" y2="254" stroke="#9E9E9E" stroke-width="2"/>
  <line x1="195" y1="244" x2="195" y2="254" stroke="#9E9E9E" stroke-width="2"/>
  <rect x="50" y="230" width="260" height="14" rx="2" fill="#1E5631" stroke="#0F3A20" stroke-width="0.8"/>
  <text class="s" x="180" y="278" text-anchor="middle">Socket stays soldered on the board</text>
  <text class="s" x="180" y="300" text-anchor="middle">HAT off: pull the plugs, wiring untouched</text>

  <!-- fixed -->
  <text class="s" x="520" y="120" text-anchor="middle">Screws and wire on the block</text>
  <rect x="490" y="150" width="60" height="80" rx="3" fill="#1E88E5" stroke="#0D47A1" stroke-width="1"/>
  <rect x="498" y="142" width="16" height="8" rx="1" fill="#9E9E9E" stroke="#616161" stroke-width="0.8"/>
  <rect x="526" y="142" width="16" height="8" rx="1" fill="#9E9E9E" stroke="#616161" stroke-width="0.8"/>
  <line x1="501" y1="146" x2="511" y2="146" stroke="#424242" stroke-width="1.5"/>
  <line x1="529" y1="146" x2="539" y2="146" stroke="#424242" stroke-width="1.5"/>
  <rect x="490" y="186" width="8" height="12" fill="#0D47A1"/>
  <line x1="400" y1="192" x2="490" y2="192" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <line x1="505" y1="244" x2="505" y2="254" stroke="#9E9E9E" stroke-width="2"/>
  <line x1="535" y1="244" x2="535" y2="254" stroke="#9E9E9E" stroke-width="2"/>
  <rect x="390" y="230" width="260" height="14" rx="2" fill="#1E5631" stroke="#0F3A20" stroke-width="0.8"/>
  <text class="s" x="520" y="278" text-anchor="middle">Whole block soldered on the board</text>
  <text class="s" x="520" y="300" text-anchor="middle">HAT off: unscrew every single wire</text>
</svg>
