<g opacity="0.42">
<rect x="470" y="700" width="250" height="44" rx="3" style="fill:white;stroke:#222;stroke-width:2;stroke-dasharray:5 4"/>
<text x="595" y="719" class="v" text-anchor="middle">U2 B0512S 5 → 12 V (rev A only)</text>
<text x="595" y="735" class="n" text-anchor="middle">via R25 0 Ω → +V_DRV, with R26 removed</text>
</g>
<text x="800" y="540" class="n" text-anchor="start">Q15/Q16 oscillate; Q17/Q18 switch C22 hard between</text>
<text x="800" y="555" class="n" text-anchor="start">≈ 0.8 V and ≈ 4.3 V. While SW is low, C22 charges through</text>
<text x="800" y="570" class="n" text-anchor="start">D21; when it goes high, D22 passes the lifted voltage into</text>
<text x="800" y="585" class="n" text-anchor="start">C23: +V_DRV ≈ 5 V + swing − two diode drops ≈ 7 V.</text>
<text x="800" y="600" class="n" text-anchor="start">Pump sees 6–7 V (needs 4 V), 5.2 V in the worst case.</text>
<text x="800" y="615" class="n" text-anchor="start">Oscillator dead: +V_DRV ≈ 3.8 V, pump stops or runs</text>
<text x="800" y="630" class="n" text-anchor="start">weakly, the readback reports it. Simulated: tools/sim.</text>
<text x="800" y="645" class="n" text-anchor="start">Draws ≈ 10 mA from the Pi's 5 V.</text>
