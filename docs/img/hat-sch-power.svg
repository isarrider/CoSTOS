<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" font-family="Helvetica, Arial, sans-serif">
<title>OSCoST HAT rev A: 5 V from the Pi and 12 V supply</title>
<desc>The HAT takes 5 V from header pins 2 and 4 (the Pi runs from its own USB-C supply, no power input on the HAT); bulk capacitor and power LED; isolated 5 to 12 V DC/DC for the pump drivers; table of the 40-pin header connections.</desc>
<style>.w{stroke:#222;stroke-width:2;fill:none}.b{stroke:#222;stroke-width:2;fill:white}.r{font-size:12px;font-weight:bold;fill:#222}.v{font-size:11px;fill:#444}.pn{font-size:11px;fill:#222}.num{font-size:10px;fill:#c62828}.n{font-size:11px;fill:#555;font-style:italic}.h{font-size:16px;font-weight:bold;fill:#222}</style>
<rect width="1180" height="650" fill="white"/>
<text x="20" y="30" class="h" text-anchor="start">1 · 5 V from the Pi (header pins 2/4, no power input, D18)</text>
<polygon points="200,130 192,121 37,121 37,139 192,139" style="fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5"/>
<text x="114.5" y="134" class="pn" text-anchor="middle" style="font-weight:bold;fill:#1565c0">+5V from Pi pins 2, 4</text>
<path class="w" d="M200 130 L620 130"/>
<circle cx="490" cy="130" r="3.5" fill="#222"/>
<g transform="translate(490 130) rotate(90)"><path class="w" d="M0 0 H17"/><path class="w" d="M23 0 H40"/><path class="w" d="M17 -12 V12" style="stroke-width:2.5"/><path class="w" d="M26 -12 Q20 0 26 12" style="stroke-width:2.5"/><text x="8" y="-8" style="font-size:12px;font-weight:bold;fill:#c62828" transform="rotate(-90 8 -8)">+</text></g>
<text x="506.0" y="148.0" class="r" text-anchor="start">C2</text>
<text x="506.0" y="162.0" class="v" text-anchor="start">100 µF</text>
<path d="M490 170 V180 M478 180 H502 M482 185 H498 M486 190 H494" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<circle cx="560" cy="130" r="3.5" fill="#222"/>
<g transform="translate(560 130) rotate(90)"><path class="w" d="M0 0 H12"/><path class="w" d="M48 0 H60"/><rect class="b" x="12" y="-7" width="36" height="14"/></g>
<text x="576.0" y="158.0" class="r" text-anchor="start">R1</text>
<text x="576.0" y="172.0" class="v" text-anchor="start">1 kΩ</text>
<g transform="translate(560 190) rotate(90)"><path class="w" d="M0 0 H12"/><path class="w" d="M28 0 H40"/><path d="M12 -9 L28 0 L12 9 Z" style="fill:white;stroke:#222;stroke-width:2"/><path class="w" d="M28 -9 V9"/><path class="w" d="M14 -12 L21 -20" style="stroke-width:1.5"/><path d="M21 -20 L16 -18 L20 -15 Z" fill="#222"/><path class="w" d="M22 -12 L29 -20" style="stroke-width:1.5"/><path d="M29 -20 L24 -18 L28 -15 Z" fill="#222"/></g>
<text x="590.0" y="208.0" class="r" text-anchor="start">D2</text>
<text x="590.0" y="222.0" class="v" text-anchor="start">PWR green</text>
<path d="M560 230 V240 M548 240 H572 M552 245 H568 M556 250 H564" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path d="M620 130 V118 M608 118 H632" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="620" y="108" class="r" text-anchor="middle" style="fill:#ef6c00">+5V</text>
<text x="632" y="150" class="n" text-anchor="start">→ U2, U7, LEDs</text>
<text x="20" y="300" class="n" text-anchor="start">The Pi runs from its own USB-C supply (D15); the HAT draws</text>
<text x="20" y="315" class="n" text-anchor="start">&lt; 200 mA from header pins 2/4, behind the Pi's own input</text>
<text x="20" y="330" class="n" text-anchor="start">protection, so it needs no fuse, TVS or ideal diode (D18).</text>
<text x="20" y="345" class="n" text-anchor="start">Earlier drafts had J1, F1, D1, Q1, U1 and C1 here (power input</text>
<text x="20" y="360" class="n" text-anchor="start">with ideal diode); those reference designators stay unused.</text>
<text x="20" y="490" class="h" text-anchor="start">2 · 12 V for the pump drivers</text>
<path d="M40 550 V538 M28 538 H52" style="stroke:#ef6c00;stroke-width:2.5;fill:none"/>
<text x="40" y="528" class="r" text-anchor="middle" style="fill:#ef6c00">+5V</text>
<path class="w" d="M40 550 L150 550"/>
<circle cx="90" cy="550" r="3.5" fill="#222"/>
<g transform="translate(90 550) rotate(90)"><path class="w" d="M0 0 H17"/><path class="w" d="M23 0 H40"/><path class="w" d="M17 -12 V12" style="stroke-width:2.5"/><path class="w" d="M23 -12 V12" style="stroke-width:2.5"/></g>
<text x="106.0" y="568.0" class="r" text-anchor="start">C3</text>
<text x="106.0" y="582.0" class="v" text-anchor="start">4.7 µF</text>
<path d="M90 590 V600 M78 600 H102 M82 605 H98 M86 610 H94" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<rect x="170" y="530" width="160" height="70" rx="3" style="fill:#fafafa;stroke:#222;stroke-width:2"/>
<text x="250.0" y="563.0" class="r" text-anchor="middle">U2</text>
<text x="250.0" y="578.0" class="v" text-anchor="middle">B0512S-1WR3</text>
<text x="175" y="554" class="pn" text-anchor="start">Vin</text>
<text x="166" y="546" class="num" text-anchor="end">2</text>
<path class="w" d="M170 550 L150 550"/>
<text x="175" y="584" class="pn" text-anchor="start">GND</text>
<text x="166" y="576" class="num" text-anchor="end">1</text>
<path class="w" d="M170 580 L150 580"/>
<text x="325" y="554" class="pn" text-anchor="end">+Vo</text>
<text x="334" y="546" class="num" text-anchor="start">4</text>
<path class="w" d="M330 550 L350 550"/>
<text x="325" y="584" class="pn" text-anchor="end">0V</text>
<text x="334" y="576" class="num" text-anchor="start">3</text>
<path class="w" d="M330 580 L350 580"/>
<path class="w" d="M150 580 L150 595"/>
<path d="M150 595 V605 M138 605 H162 M142 610 H158 M146 615 H154" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path class="w" d="M350 580 L360 580 L360 595"/>
<path d="M360 595 V605 M348 605 H372 M352 610 H368 M356 615 H364" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path class="w" d="M350 550 L560 550"/>
<circle cx="400" cy="550" r="3.5" fill="#222"/>
<g transform="translate(400 550) rotate(90)"><path class="w" d="M0 0 H17"/><path class="w" d="M23 0 H40"/><path class="w" d="M17 -12 V12" style="stroke-width:2.5"/><path class="w" d="M23 -12 V12" style="stroke-width:2.5"/></g>
<text x="416.0" y="568.0" class="r" text-anchor="start">C4</text>
<text x="416.0" y="582.0" class="v" text-anchor="start">10 µF 25 V</text>
<path d="M400 590 V600 M388 600 H412 M392 605 H408 M396 610 H404" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<circle cx="490" cy="550" r="3.5" fill="#222"/>
<g transform="translate(490 550) rotate(90)"><path class="w" d="M0 0 H12"/><path class="w" d="M48 0 H60"/><rect class="b" x="12" y="-7" width="36" height="14"/></g>
<text x="506.0" y="578.0" class="r" text-anchor="start">R2</text>
<text x="506.0" y="592.0" class="v" text-anchor="start">1.5 kΩ ¼ W</text>
<path d="M490 610 V620 M478 620 H502 M482 625 H498 M486 630 H494" style="stroke:#2e7d32;stroke-width:2;fill:none"/>
<path d="M560 550 V538 M548 538 H572" style="stroke:#c62828;stroke-width:2.5;fill:none"/>
<text x="560" y="528" class="r" text-anchor="middle" style="fill:#c62828">+12V</text>
<text x="620" y="545" class="n" text-anchor="start">U2: 1 W, isolated, unregulated; its 0V is tied to GND.</text>
<text x="620" y="560" class="n" text-anchor="start">R2 is a minimum load (≈ 8 mA) so the unregulated</text>
<text x="620" y="575" class="n" text-anchor="start">output stays below the TVS standoff (13 V) at light load.</text>
<text x="720" y="30" class="h" text-anchor="start">3 · 40-pin header (Pi 4 / Pi 5)</text>
<rect x="720" y="50" width="440" height="448" rx="4" style="fill:#fafafa;stroke:#222;stroke-width:2"/>
<text x="730" y="69" class="r" text-anchor="start">Net</text>
<text x="840" y="69" class="r" text-anchor="start">Pin</text>
<text x="930" y="69" class="r" text-anchor="start">GPIO</text>
<text x="980" y="69" class="r" text-anchor="start">Use</text>
