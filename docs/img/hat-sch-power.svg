<text x="620" y="108" class="r" text-anchor="middle" style="fill:#ef6c00">+5V</text>
<text x="632" y="150" class="n" text-anchor="start">→ doubler, Q12, LEDs</text>
<text x="20" y="300" class="n" text-anchor="start">The Pi runs from its own USB-C supply (D15); the HAT draws</text>
<text x="20" y="315" class="n" text-anchor="start">&lt; 200 mA from header pins 2/4, behind the Pi's own input</text>
<text x="20" y="330" class="n" text-anchor="start">protection, so it needs no fuse, TVS or ideal diode (D18).</text>
<text x="20" y="345" class="n" text-anchor="start">Earlier drafts had J1, F1, D1, Q1, U1 and C1 here (power input</text>
<text x="20" y="360" class="n" text-anchor="start">with ideal diode); those reference designators stay unused.</text>
