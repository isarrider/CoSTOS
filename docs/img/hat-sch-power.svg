<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" font-family="Helvetica, Arial, sans-serif">
<title>CoSTOS HAT rev A: 5 V from the Pi and the pump driver supply</title>
<desc>The HAT takes 5 V from header pins 2 and 4 (the Pi runs from its own USB-C supply, no power input on the HAT); bulk capacitor and power LED; a voltage doubler from a two-transistor oscillator, a push-pull pair and two diodes lifts the 5 V to about 7 V for the pump driver; table of the 40-pin header connections.</desc>
