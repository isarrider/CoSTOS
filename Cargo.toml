[workspace]
resolver = "3"
members = ["crates/costos-core", "crates/costos-safety", "crates/costos-replay", "crates/costos-sim", "crates/costos-cycle", "crates/costos-config", "crates/costosd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/isarrider/CoSTOS"
rust-version = "1.85"

[workspace.dependencies]
costos-core = { path = "crates/costos-core" }
costos-safety = { path = "crates/costos-safety" }
costos-cycle = { path = "crates/costos-cycle" }
costos-config = { path = "crates/costos-config" }
costos-sim = { path = "crates/costos-sim" }
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# ARCHITECTURE 6.1 rule 11: `.get(i)` instead of `[i]`
indexing_slicing = "warn"
# rule 7 / 17: no silent wrap-around
arithmetic_side_effects = "warn"
float_cmp = "warn"
unwrap_used = "warn"
expect_used = "warn"

# ARCHITECTURE 6.1 rule 9: overflow checks also in release builds of the
# two crates that decide what the pumps do.
[profile.release.package.costos-core]
overflow-checks = true

[profile.release.package.costos-safety]
overflow-checks = true

# costos-cycle runs the chain above every second: same rule.
[profile.release.package.costos-cycle]
overflow-checks = true
